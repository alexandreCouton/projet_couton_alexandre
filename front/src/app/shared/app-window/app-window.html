<div class="title-bar" (dblclick)="toggleMaximize()">
  @if (icon(); as icon) {
    <i class="pixelart-icons-font-{{ icon }} icon" aria-hidden="true"></i>
  }
  <span [id]="titleId" class="title-text">{{ heading() }}</span>
  <span class="title-buttons">
    <button type="button" class="tb-btn" (click)="minimize()" aria-label="Réduire" title="Réduire">
      <i class="pixelart-icons-font-minus icon" aria-hidden="true"></i></button
    ><button
      type="button"
      class="tb-btn"
      (click)="toggleMaximize()"
      [attr.aria-label]="maximized() ? 'Restaurer' : 'Agrandir'"
      [title]="maximized() ? 'Restaurer' : 'Agrandir'"
    >
      <i
        class="pixelart-icons-font-{{ maximized() ? 'copy' : 'square' }} icon"
        aria-hidden="true"
      ></i></button
    ><button
      type="button"
      class="tb-btn tb-close"
      (click)="close()"
      [disabled]="!closeLink()"
      aria-label="Fermer"
      title="Fermer"
    >
      <i class="pixelart-icons-font-close icon" aria-hidden="true"></i>
    </button>
  </span>
</div>

@if (menu()) {
  <div class="menu-bar" aria-hidden="true">
    <span><u>F</u>ichier</span><span><u>É</u>dition</span><span><u>A</u>ide</span>
  </div>
}

<ng-content />

<div class="status-bar">
  <ng-content select="[status]" />
</div>
