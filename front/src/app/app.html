<main>
  <router-outlet />
</main>

<nav class="taskbar" aria-label="Navigation principale">
  <a
    class="btn task"
    routerLink="/pollutions"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <span class="btn-inner"
      ><i class="pixelart-icons-font-list icon" aria-hidden="true"></i> Pollutions</span
    >
  </a>
  <a class="btn task" routerLink="/pollutions/new" routerLinkActive="active">
    <span class="btn-inner"
      ><i class="pixelart-icons-font-plus icon" aria-hidden="true"></i> Déclarer</span
    >
  </a>
  <a class="btn task" routerLink="/signup" routerLinkActive="active">
    <span class="btn-inner"
      ><i class="pixelart-icons-font-user-plus icon" aria-hidden="true"></i> Inscription</span
    >
  </a>

  @if (windowManager.minimized().length) {
    <span class="separator" aria-hidden="true"></span>
  }
  @for (w of windowManager.minimized(); track w.id) {
    <button
      type="button"
      class="btn task minimized-task"
      (click)="w.restore()"
      [title]="'Restaurer ' + w.heading()"
    >
      <span class="btn-inner">
        @if (w.icon()) {
          <i class="pixelart-icons-font-{{ w.icon() }} icon" aria-hidden="true"></i>
        }
        {{ w.heading() }}
      </span>
    </button>
  }
</nav>
